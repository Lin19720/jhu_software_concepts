name: Python Tests and Coverage

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium sqlalchemy flask pytest pytest-cov sphinx sphinx-rtd-theme
          if [ -f module_4/requirements.txt ]; then pip install -r module_4/requirements.txt; fi

      - name: Run Pytest
        env:
          PYTHONPATH: module_4/src:module_4
        run: |
          cd module_4
          python -m pytest -m "web or buttons or analysis or db or integration"
